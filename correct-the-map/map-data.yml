map_id: correct-the-map-world-projection-comparison-v1
title: "Correct the Map: Mercator and Equal Earth"
purpose: "Demonstrate how the same global country-boundary data appears under a conformal navigation projection and an equal-area world projection."
provider: "Omoluabi / Small Systems Lab"
dataset_refs:
  - name: "Natural Earth Admin 0 – Countries"
    version_or_scale: "1:110m cultural vectors"
    url: "https://www.naturalearthdata.com/downloads/110m-cultural-vectors/110m-admin-0-countries/"
    license: "Public domain"
spatial_refs:
  - panel: "Mercator"
    projection: "Web Mercator"
    epsg: "EPSG:3857"
    preserved_property: "Local angle and rhumb-line direction"
    distortion_notice: "Area scale increases with latitude; this panel must not be used for comparative area."
  - panel: "Equal Earth"
    projection: "Equal Earth"
    proj_string: "+proj=eqearth +datum=WGS84 +units=m +no_defs"
    preserved_property: "Relative area"
    distortion_notice: "Shape, direction, and distance are not preserved everywhere."
coordinate_system: "WGS 84 input coordinates; projection-specific output coordinates"
boundary_source: "Natural Earth Admin 0 country boundaries; generalized global data, not a legal boundary authority"
place_name_source: "No place labels are shown in the static comparison"
language: "English"
provenance_ref: "SOURCE_NOTES.md#5-boundary-data-used-in-this-publication"
created: "2026-09-14"
accessibility:
  visual_alt: "Two world maps made from the same country-boundary data. Mercator visually enlarges high-latitude regions and visually reduces equatorial Africa; Equal Earth preserves their relative areas."
  nonvisual_summary: "Africa is about 30.37 million square kilometres; Greenland is about 2.17 million square kilometres. The Equal Earth panel makes their roughly fourteen-to-one area relationship visible."
  colour_dependence: "None; panels are identified by heading and position, not color alone."
editorial_status: "Published proof of concept"
limitations:
  - "No flat map preserves area, shape, distance, and direction at once."
  - "This is a global comparison, not a local map, legal boundary source, or navigational tool."
  - "The map does not itself establish causal claims about political, cultural, or economic outcomes."
